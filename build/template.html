<title>Tennoform</title>
<meta name="theme-color" content="#070B10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: in-game Arsenal/Codex feel. Single deliberate dark theme: void black, Orokin gold for progress and primary actions, Lotus cyan for interactive lines. Chamfered panels, phone-first, fixed bottom bar under 900px. */
:root{
  color-scheme:dark;
  --bg:#070B10; --panel:#0E161E; --panel2:#121D27; --sunk:#0A1118; --ink:#DCE6EA; --muted:#8FA3AC; --line:#1E3440; --line2:#2B4A58;
  --gold:#D9B45E; --gold-dim:#8C7338; --gold-ink:#140E02; --cyan:#6FD6E8; --cyan-soft:rgba(111,214,232,.10);
  --good-soft:rgba(217,180,94,.12); --ok:#7FD88F; --warn:#F0A868; --warn-soft:rgba(240,168,104,.12); --bad:#EF7272; --bad-soft:rgba(239,114,114,.12);
  --c-common:#C99A6A; --c-unc:#C4D0D8; --c-rare:#F2CF5B;
  --f-display:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --cut:10px; --navh:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(ellipse 90% 40% at 50% -5%,rgba(111,214,232,.13),transparent 70%),linear-gradient(rgba(111,214,232,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(111,214,232,.035) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px;background-attachment:fixed}
a{color:var(--cyan)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(7,11,16,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim) 20%,var(--gold) 50%,var(--gold-dim) 80%,transparent)}
.bar-in{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;gap:12px;align-items:center}
.brand{font:700 22px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;display:flex;gap:9px;align-items:center;text-decoration:none;color:var(--ink);flex:none}
.brand b{color:var(--gold);font-weight:700}
nav.tabs{display:flex;gap:0;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs a{font:600 14.5px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:10px 10px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold)}
.acct{margin-left:auto;flex:none;display:grid;place-items:center;min-width:36px;height:36px;padding:0 10px;border:1px solid var(--line2);color:var(--cyan);text-decoration:none;font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.acct[hidden]{display:none}
@media (max-width:420px){.has-acct .brand{font-size:15px;letter-spacing:.05em;gap:6px}.has-acct .bar-in{gap:6px}}
@media (max-width:520px){.acct:not([hidden])~.mrb .t{display:none}.acct{padding:0 8px;font-size:12px}}
.acct.in{border-radius:50%;padding:0;width:36px;background:var(--cyan-soft);font-size:16px}
.acct:not([hidden])+.mrb{margin-left:8px}
.mrb{margin-left:auto;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:none}
.ring{border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p,0)*1%),#1B2A35 0);box-shadow:0 0 14px rgba(217,180,94,.25)}
.mrb .ring{width:40px;height:40px}
.ring>span{border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.mrb .ring>span{width:32px;height:32px;font-size:16px;color:var(--gold)}
.mrb .t{display:flex;flex-direction:column;line-height:1.1;text-align:right}
.mrb .t b{font:700 15px var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.mrb .t small{font:11px var(--f-mono);color:var(--muted)}
.bnav,.drawer{display:none}
@media (max-width:899px){
  nav.tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,11,16,.97);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:var(--navh);text-decoration:none;color:var(--muted);font:700 11px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;background:none;border:0;cursor:pointer;min-width:0}
  .bnav svg{width:22px;height:22px}
  .bnav [aria-current="page"]{color:var(--gold)}
  .drawer.open{display:block;position:fixed;inset:0;z-index:40;background:rgba(3,6,9,.7)}
  .drawer .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--gold-dim);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .drawer a{display:flex;align-items:center;min-height:52px;padding:0 14px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);text-decoration:none;font:700 16px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
  .drawer a[aria-current="page"]{border-color:var(--gold);color:var(--gold)}
  main{padding-bottom:calc(var(--navh) + 32px + env(safe-area-inset-bottom,0px))!important}
}
@media (max-width:420px){.mrb .t small{display:none}.brand{font-size:18px;letter-spacing:.1em}}
main{max-width:1120px;margin:0 auto;padding-block:18px 60px;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(30px,7.5vw,48px);line-height:1;text-transform:uppercase;letter-spacing:.08em}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);display:flex;align-items:center;gap:10px}
h2::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--gold);flex:none}
h3{font-size:20px;line-height:1.15;letter-spacing:.04em}
.lede{color:var(--muted);max-width:68ch;margin:6px 0 0}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.head{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:14px;min-width:0;position:relative}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--f-mono);padding:4px 7px;background:var(--sunk);border:1px solid var(--line);color:var(--ink);white-space:nowrap;text-decoration:none}
.chip.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.chip.teal{background:var(--cyan-soft);border-color:var(--line2);color:var(--cyan)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--gold)}
.chip.ok{background:rgba(127,216,143,.12);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn{border:1px solid var(--line2);background:var(--sunk);padding:9px 14px;min-height:42px;cursor:pointer;font:700 14px/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.on{background:var(--cyan-soft);color:var(--cyan);border-color:var(--cyan)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12.5px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
.obj-h .seg{margin-inline:-14px;padding-inline:14px}
.seg .btn{flex:none;white-space:nowrap}
select,input[type=search],input[type=number],input[type=text],input[type=password],input[type=email],textarea{background:var(--sunk);border:1px solid var(--line2);padding:10px 12px;min-height:44px;font-size:16px;min-width:0;max-width:100%;width:100%;color:var(--ink)}
select:focus,input:focus,textarea:focus{border-color:var(--cyan);outline:none}
textarea{min-height:110px;font:13px var(--f-mono)}
.prog{display:flex;align-items:center;gap:8px;font:12px var(--f-mono);color:var(--muted)}
.prog .track{flex:1;min-width:50px;height:4px;background:#1B2A35;overflow:hidden}
.prog .fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.prog .fill{transition:none}}
.obj{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);min-width:0}
.obj-h{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.obj-h .title{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.steps{list-style:none;margin:0;padding:0}
.step{border-bottom:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px}
.step:last-child{border-bottom:0}
.lbl{font-weight:600;cursor:pointer}
.step.done>div>.lbl,.mitem.done>.top .nm,.qrow.done .nm{text-decoration:line-through;text-decoration-color:var(--gold);color:var(--muted)}
.ck{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:1.5px solid var(--line2);margin:0;cursor:pointer;display:grid;place-items:center;background:var(--sunk);flex:none;transform:rotate(45deg) scale(.82)}
.ck:checked{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(217,180,94,.45)}
.ck:checked::after{content:"";width:6px;height:12px;border:solid var(--gold-ink);border-width:0 3px 3px 0;transform:translate(-1px,-1px)}
.ck.sm{width:22px;height:22px}
.ck.sm:checked::after{width:5px;height:10px;border-width:0 2.5px 2.5px 0}
.src{font-size:13.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.src b{color:var(--ink);font-weight:600}
.where b{color:var(--cyan);font-weight:600}
a.ln{color:var(--cyan);text-decoration:none;border-bottom:1px dotted rgba(111,214,232,.5)}
a.ln:hover{border-bottom-style:solid}
.reslist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.reslist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 10px;align-items:start;font-size:13.5px}
.reslist .q{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.reslist .where{grid-column:2;color:var(--muted);overflow-wrap:anywhere}
.have{font:600 11.5px var(--f-mono);margin-left:6px}
.have.ok{color:var(--ok)} .have.no{color:var(--warn)}
details{min-width:0}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.relics{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.relic>summary{display:inline-flex;gap:6px;align-items:center;font:500 12.5px/1 var(--f-mono);padding:9px 10px;border:1px solid var(--line2);background:var(--sunk);color:var(--ink)}
.relic[open]{flex-basis:100%}
.relic[open]>summary{border-color:var(--cyan);background:var(--cyan-soft)}
.relic .body{margin-top:6px;padding:10px 12px;border-left:2px solid var(--cyan);background:var(--sunk);font-size:13.5px;color:var(--ink)}
.rar-C{color:var(--c-common)} .rar-U{color:var(--c-unc)} .rar-R{color:var(--c-rare);font-weight:600}
.dot{width:8px;height:8px;transform:rotate(45deg);display:inline-block;background:currentColor}
.vault{color:var(--bad)}
.tag-v{font:600 11px var(--f-mono);color:var(--bad);letter-spacing:.06em;text-transform:uppercase}
.sub{margin-top:8px;padding-left:10px;border-left:1px solid var(--line2)}
.more>summary{color:var(--cyan);font-size:13.5px;font-weight:600;padding:6px 0}
.more>summary::before{content:"▸ "}
.more[open]>summary::before{content:"▾ "}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px;margin-top:6px}
.mod{border:1px solid var(--line2);padding:10px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;background:var(--sunk)}
.mod.done{border-color:var(--gold-dim);background:var(--good-soft)}
.mod .slot{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.mod .nm{font-weight:600}
.pol{font:11px var(--f-mono);color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font:700 26px/1 var(--f-display);letter-spacing:.04em;color:var(--ink)}
.stat .k{font:11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:14px}
.grp>summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:13px 14px;border-bottom:1px solid var(--line);min-height:52px}
.grp>summary h3{flex:1 1 auto;min-width:0;font-size:19px;text-transform:uppercase;letter-spacing:.08em}
.grp>summary .prog{flex:1 1 140px;min-width:0}
.grp>summary::after{content:"▾";color:var(--gold)}
.grp:not([open])>summary::after{content:"▸"}
.mitem{border-bottom:1px solid var(--line);padding:10px 14px}
.mitem:last-child{border-bottom:0}
.mitem>.top{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.mitem .nm{font-weight:600}
.mitem summary{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-height:28px}
.mitem summary .open{margin-left:auto;font:600 12.5px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.mitem details[open] summary .open{visibility:hidden}
.lazybody{padding:10px 0 2px}
.results{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.hit{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;min-height:46px;border:1px solid transparent;border-left:2px solid transparent;background:none;text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.hit:hover,.hit.sel{border-color:var(--line);border-left-color:var(--gold);background:var(--panel)}
.callout{border-left:2px solid var(--gold);background:var(--panel);padding:10px 14px;font-size:14px}
.navcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.navcard:hover{border-color:var(--gold-dim)}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:900px){.split.two{grid-template-columns:320px minmax(0,1fr)}.split.wf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.empty{padding:22px;text-align:center;color:var(--muted)}
.bigmr{display:flex;gap:16px;align-items:center}
.bigmr .ring{width:96px;height:96px;flex:none}
.bigmr .ring>span{width:80px;height:80px;font-size:38px;color:var(--gold)}
.bd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.bd .num{text-align:right}
.qrow{border-bottom:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;transition:background .4s}
.qrow:last-child{border-bottom:0}
.qrow .nm{font-weight:600}
.qrow ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 20px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--gold-ink);padding:10px 16px;font-weight:600;font-size:14px;z-index:50;width:max-content;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
.nodes{display:grid;grid-template-columns:minmax(0,1fr) auto auto}
.nodes>div{padding:8px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:46px;min-width:0}
.nodes .h{font:600 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;min-height:0;padding:6px 0}
.nodes .c{justify-content:center;padding-inline:12px}
.tier{border:1px solid var(--line);background:var(--sunk);padding:10px 12px}
.tier h4{margin:0 0 6px;font:700 14px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.tier ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.seller{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;margin-top:4px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card .top{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.card .nm{font:700 18px var(--f-display);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14px}
.kv .num{text-align:right}
.inv{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:6px 10px;align-items:center}
.inv input{min-height:38px;padding:6px 8px;text-align:right}
.ft{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.ready{color:var(--ok);font-weight:600}
.hubgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:900px){.hubgrid{grid-template-columns:minmax(0,380px) minmax(0,1fr)}}
.bdp{padding:16px;border:1px solid var(--line2);background:linear-gradient(100deg,rgba(14,22,30,.95) 0%,rgba(40,34,18,.92) 55%,rgba(14,22,30,.95) 100%);display:flex;flex-direction:column;gap:10px}
.bdg{display:flex;flex-direction:column;gap:2px}
.bdl{display:flex;gap:10px;align-items:baseline;background:none;border:0;padding:3px 0;text-align:left;color:var(--ink);cursor:pointer;font:600 16px var(--f-display);letter-spacing:.03em}
.bdl b{color:#fff;min-width:78px}
.bdl span{color:#F3E3B0}
.bdl small{margin-left:auto;color:var(--muted);font-size:11px}
.bdl .ovt{margin-left:6px;color:var(--gold)}
.bdl:hover span{color:var(--cyan)}
.bdtot{display:flex;justify-content:space-between;border-top:1px solid var(--gold-dim);padding-top:8px;font:700 18px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.bdtot b{color:var(--gold)}
.card.locked{opacity:.65}
.steps-v{display:flex;flex-direction:column;gap:14px}
.sv{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.sv>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.svn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font:700 16px var(--f-display);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.svn::first-line{}
.filebtn{align-self:flex-start;cursor:pointer}
.drop{border:1px dashed var(--line2);padding:12px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-soft)}

/* ---------- mastery math ---------- */
const BIG=['Warframe','Sentinel','Companion','Archwing','K-Drive','Necramech'];
const CATS=['Warframe','Primary','Secondary','Melee','Sentinel','Robotic Weapon','Companion','Archwing','Arch-Gun','Arch-Melee','Necramech','K-Drive','Zaw','Kitgun','Amp'];
const CATL={Warframe:'Warframes',Primary:'Primary Weapons',Secondary:'Secondary Weapons',Melee:'Melee Weapons',Sentinel:'Sentinels','Robotic Weapon':'Sentinel Weapons',Companion:'Companions',Archwing:'Archwing','Arch-Gun':'Archgun','Arch-Melee':'Archmelee',Necramech:'Necramechs','K-Drive':'K-Drives',Zaw:'Zaws',Kitgun:'Kitguns',Amp:'Amps'};
const EXTRA=[['chart','Missions'],['sp','The Steel Path Missions'],['rail','Railjack Intrinsics'],['drift','Drifter Intrinsics'],['other','Other gear (MOAs, Hounds, Amps…)']];
const IR=['Tactical','Piloting','Gunnery','Engineering','Command'],ID=['Riding','Combat','Opportunity','Endurance'];
const MI=Object.values(I).filter(i=>i.n!=='Helminth');
function isMech(it){return it&&it.c==='Necramech'}
function perRank(it){return it&&(BIG.includes(it.c)||isMech(it))?200:100}
function maxRank(it){return it&&(/^(Kuva|Tenet|Coda) /.test(it.n)||it.n==='Paracesis'||isMech(it))?40:30}
function mxp(it){return it?perRank(it)*maxRank(it):0}
function itemXP(n){const it=I[n];if(on('m|'+n))return mxp(it);const r=P.rk[n];return r?Math.min(r,maxRank(it))*perRank(it):0}
function rankOf(n){const it=I[n];return on('m|'+n)?maxRank(it):Math.min(+(P.rk[n]||0),maxRank(it))}
function setRank(n,r){const it=I[n];const mx=maxRank(it);r=Math.max(0,Math.min(mx,Math.round(+r||0)));
  if(r>=mx){delete P.rk[n];if(!on('m|'+n))setK('m|'+n,1)}else{if(on('m|'+n))setK('m|'+n,0);if(r)P.rk[n]=r;else delete P.rk[n]}saveProfile();updateMR();return r}
function autoCat(c){let x=0,m=0,t=0,p=0;for(const it of MI)if(it.c===c){t++;const v=itemXP(it.n);x+=v;if(v>=mxp(it))m++;else if(v>0)p++}return {x,m,t,p}}
function intrSum(o){return Object.values(o||{}).reduce((a,v)=>a+(+v||0),0)}
function autoExtra(k){if(k==='chart')return NODES.reduce((a,n)=>a+(on('n|'+n.id)?n.x:0),0);if(k==='sp')return NODES.reduce((a,n)=>a+(on('sp|'+n.id)?n.x:0),0);
  if(k==='rail'){const s=intrSum(P.intrR);return (s||(!P.intrD&&+P.intr)||0)*1500}if(k==='drift')return intrSum(P.intrD)*1500;if(k==='other')return (+P.other||0)+othXP();return 0}
function isOv(k){return P.bo&&P.bo[k]!=null&&P.bo[k]!==''}
function catXP(k){if(isOv(k))return +P.bo[k];return CATS.includes(k)?autoCat(k).x:autoExtra(k)}
function totalXP(){const rows=[...CATS,...EXTRA.map(e=>e[0])].map(k=>[k,catXP(k)]);const g=k=>rows.find(r=>r[0]===k)[1];
  const it=CATS.reduce((a,k)=>a+g(k),0);const adj=+P.adj||0;const raw=rows.reduce((a,r)=>a+r[1],0)+adj;const base=inGameBase();const un=base?Math.max(0,base.x-raw):0;
  return {rows,it,ch:g('chart'),sp:g('sp'),intr:g('rail')+g('drift'),other:g('other'),adj,raw,un,base,total:raw+un}}
const mrNeed=m=>m<=30?2500*m*m:2250000+(m-30)*147500;
function mrInfo(x){let mr=0;while(mr<30&&mrNeed(mr+1)<=x)mr++;if(mr===30)mr=30+Math.max(0,Math.floor((x-2250000)/147500));
  const cur=mrNeed(mr),next=mrNeed(mr+1);return {mr,cur,next,pct:Math.max(0,Math.min(100,(x-cur)/(next-cur)*100))}}
const mrLabel=m=>m>30?'L'+(m-30):String(m);
function updateMR(){const ab=$('#acctbtn');if(ab){ab.hidden=!(HOSTED&&FB);ab.textContent=acct&&acct.kind==='fb'?((acct.name||acct.email||'?').trim()[0]||'?').toUpperCase():'Sign in';ab.classList.toggle('in',!!(acct&&acct.kind==='fb'));document.body.classList.toggle('has-acct',!ab.hidden)}const t=totalXP(),m=mrInfo(t.total);$('#mrb-n').textContent=mrLabel(m.mr);$('#mrb-t').textContent=(m.mr>30?'Legendary ':'MR ')+mrLabel(m.mr);
  $('#mrb-s').textContent=fmt(m.next-t.total)+' XP to next';$('#mrb-r').style.setProperty('--p',m.pct.toFixed(1));const b=$('#bigmr');if(b)b.outerHTML=bigMR();const hh=$('#hero');if(hh)hh.outerHTML=heroHTML();if(typeof rkHdr==='function')rkHdr()}

/* ---------- linking ---------- */
function partOwner(n){return Object.values(I).find(it=>it.parts.some(p=>p.full===n))}
function L(name,label){label=label??name;const n=String(name);
  let t=null;if(RES[n])t='res|'+n;else if(I[n])t='item|'+n;else if(D.partrel[n])t='part|'+n;else if(REL[n.replace(/ Relic$/,'')])t='relic|'+n.replace(/ Relic$/,'');else if(MODS[n])t='mod|'+n;else if(ARC[n])t='arc|'+n;
  else{const m=n.match(/^(.+?) (Neuroptics|Chassis|Systems|Blueprint|Harness|Wings)$/);if(m&&I[m[1]])t='item|'+m[1]}
  return t?`<a class="ln" href="#" data-go="${esc(t)}">${esc(label)}</a>`:esc(label)}
function go(t){const i=t.indexOf('|');const ty=t.slice(0,i),n=t.slice(i+1);
  if(ty==='res'){state.resSel=n;state.resQ='';if(location.hash!=='#resources')location.hash='resources';else{render();window.scrollTo(0,0)}return}
  if(ty==='item'&&I[n]&&I[n].c==='Warframe'){state.frame=n;state.build=0;saveUI();if(location.hash!=='#frames')location.hash='frames';else{render();window.scrollTo(0,0)}return}
  if(ty==='node'){state.scP=n||null;state.planet=null;if(location.hash!=='#missions')location.hash='missions';else render();return}
  state.farmSel=t;if(location.hash!=='#farm')location.hash='farm';else{render();setTimeout(()=>$('#fdet')?.scrollIntoView({block:'start',behavior:'smooth'}),30)}}

/* ---------- helpers ---------- */
function priceChip(n,label){const p=PR[n];if(!p)return'';const v=p.a7??p.a30;if(v==null)return'';
  return `<a class="chip gold" href="https://warframe.market/items/${MS[n]}" target="_blank" rel="noopener" title="warframe.market 7-day average">${label||''}${Math.round(v)}p</a>`}
function whisper(item,s){return `/w ${s[0]} Hi! I want to buy: "${item}" for ${s[1]} platinum. (warframe.market)`}
function sellerRow(item){const s=(SEL[item]||[]).filter(x=>x[0]!=='__buy');if(!s.length)return'';const b=s[0];
  return `<div class="seller"><span class="muted">Cheapest seller:</span><b>${esc(b[0])}</b><span class="chip gold">${b[1]}p</span>${b[2]>1?`<span class="muted small">×${b[2]}</span>`:''}<button class="btn sm" data-wh="${esc(whisper(item,b))}">Copy whisper</button></div>`}
function farmFor(rn){const r=RES[rn];
  if(RT[rn]){const t=RT[rn].tiers;const best=r&&r.best;const pick=(t['Mid game']||[])[0]||(t['Early game']||[])[0];return (best?`<b>${esc(best)}</b>`:pick?`<b>${esc(pick[0])}</b> (${esc(pick[1])})`:'')+` · <a class="ln" href="#" data-go="res|${esc(rn)}">farms by stage</a>`}
  const s=RSRC[rn];if(s&&s.length)return `<b>${esc(s[0][0])}</b>${s[0][1]?' — '+esc(s[0][1]):''}${s.length>1?` · <a class="ln" href="#" data-go="res|${esc(rn)}">${s.length} options</a>`:''}`;

function haveTag(rn,q){const h=P.inv&&P.inv[rn];if(h==null||h==='')return'';return `<span class="have ${+h>=q?'ok':'no'}">have ${fmt(h)}</span>`}
function relSort(a,b){return 'CUR'.indexOf(a[1])-'CUR'.indexOf(b[1])}
function relicChips(list){if(!list||!list.length)return'';
  const open=list.filter(x=>!REL[x[0]]?.v).sort(relSort),vault=list.filter(x=>REL[x[0]]?.v).sort(relSort);
  let h='';
  if(open.length)h+=`<div class="small" style="margin-top:6px;color:var(--ok);font-weight:600">${open.length} relic${open.length>1?'s':''} farmable now. Tap one for the best nodes.</div><div class="relics">${open.map(([r,rr])=>relicDetails(r,rr)).join('')}</div>`;
  else h+=`<div class="small" style="margin-top:6px"><span class="vault">All relics vaulted.</span> Buy the part or a relic on warframe.market, or wait for Prime Resurgence (Varzia).</div>`;
  if(vault.length)h+=`<details class="more"><summary>${vault.length} vaulted relic${vault.length>1?'s':''} (trade only)</summary><div class="relics">${vault.slice(0,24).map(([r,rr])=>relicDetails(r,rr)).join('')}</div></details>`;
  return h}
function relicDetails(r,rar){const v=REL[r]?.v;
  return `<details class="relic"><summary><span class="dot rar-${rar}"></span>${esc(r)} <span class="rar-${rar}">${RAR[rar]||''}</span>${v?' <span class="tag-v">vaulted</span>':''}</summary><div class="body">${relicBody(r)}</div></details>`}
function nodeLink(label){const m=String(label).match(/^([^/]+)\/([^(·]+?)\s*\(/);if(m){const nd=ALLN.find(x=>x.n===m[2].trim()&&x.p===m[1].trim());if(nd)return `<a class="ln" href="#" data-go="node|${esc(nd.p)}">${esc(label)}</a>`}return esc(label)}
function relicBody(r){const R=REL[r];if(!R)return'No data';let h='';
  if(R.v)h+=`<div><span class="vault">Vaulted.</span> Not dropping right now. Buy it ${MS[r+' Relic']?`on <a href="https://warframe.market/items/${MS[r+' Relic']}" target="_blank" rel="noopener">warframe.market</a>`:'from other players'} or wait for Prime Resurgence.</div>${sellerRow(r+' Relic')}`;

function dropsList(dr,n){if(!dr||!dr.length)return'';return dr.slice(0,n||2).map(d=>`<b>${nodeLink(d[0])}</b> <span class="mono">${d[1]}%</span>`).join('<br>')}

function vaultChip(it){if(!it||!it.p)return'';const v=VAULT[it.n]||{};
  if(v.now)return `<span class="chip ok">Resurgence until ${fdate(v.now)}</span>`;
  if(it.v)return `<span class="chip bad">Vaulted${v.est?' · back ~'+fdate(v.est):''}</span>`;
  return `<span class="chip teal">Farmable${it.evd?' · vaults ~'+fdate(it.evd):''}</span>`}

/* ---------- item objective tree ---------- */
function totals(name,mult,acc,seen){const it=I[name];if(!it)return acc;
  acc.cr+=(it.cr||0)*mult;
  for(const p of it.parts){if(p.k==='r')acc.r[p.n]=(acc.r[p.n]||0)+p.q*mult;
    else if(p.k==='p'){acc.cr+=(p.cr||0)*mult;(p.sub||[]).forEach(([n,q])=>acc.r[n]=(acc.r[n]||0)+q*mult);if(p.t)acc.pt=Math.max(acc.pt,p.t)}
    else if(p.k==='i'&&I[p.n]&&!seen.includes(p.n))totals(p.n,p.q*mult,acc,[...seen,name])}
  return acc}
function bpSource(it,note){const n=it.n;
  if(it.bprel)return `Drops from Void Relics ${priceChip(n+' Blueprint','BP ')}${sellerRow(n+' Blueprint')}`+relicChips(it.bprel);
  let h='';if(it.bpd&&it.bpd.length)h+=dropsList(it.bpd,2);
  if(it.bc)h+=(h?'<br>':'')+`Buy the blueprint in the in-game <b>Market for ${fmt(it.bc)} credits</b>`;
  if(it.dr&&it.dr.length&&!it.bpd)h+=(h?'<br>':'')+dropsList(it.dr,2);
  if(note)h+=(h?'<br>':'')+`<b>Your sheet:</b> ${esc(note)}`;
  const qs=Q.filter(q=>q.rw.some(r=>r.toLowerCase().startsWith(n.toLowerCase()+' ')));
  if(qs.length)h+=(h?'<br>':'')+`Quest reward: ${qs.map(q=>`<a class="ln" href="#quests" data-q="${esc(q.n)}">${esc(q.n)}</a>`).join(', ')}`;
  if(!h)h=`Special source (syndicate, vendor or event). ${it.w?`<a href="${it.w}" target="_blank" rel="noopener">Wiki</a>`:''}`;
  if(it.mp)h+=`<br><span class="muted">Or buy it ready-built for ${it.mp} platinum.</span>`;
  return h}
function resRows(list,prefix){return `<ul class="reslist">`+list.map(([n,q])=>`<li>${ck(prefix+'|'+n,'sm')}<span class="q">${fmt(q)} × ${L(n)}${haveTag(n,q)}</span><span class="where">${farmFor(n)}</span></li>`).join('')+'</ul>'}
function itemTree(name,opts){opts=opts||{};const it=I[name];if(!it)return `<div class="panel">No data for ${esc(name)}</div>`;
  const depth=opts.depth||0;const rk=P.rk[name];
  let h=`<section class="obj" data-scope><div class="obj-h">${depth===0?art(name,'hero-art'):''}<div class="title"><h3>${esc(name)}</h3>
    <span class="chip">${esc(it.c)}</span>${it.mr?`<span class="chip">MR ${it.mr}</span>`:''}${vaultChip(it)}${rk&&!on('m|'+name)?`<span class="chip teal">Rank ${rk}</span>`:''}${it.p?priceChip(name+' Set','Set '):''}
    ${mxChip(name)}${it.w?`<a class="small" href="${it.w}" target="_blank" rel="noopener">wiki</a>`:''}<span class="row" style="margin-left:auto;gap:4px">${it.t?`<button class="btn sm" data-fstart="${esc(name)}" title="Start a Foundry timer">⏱ Foundry</button>`:''}${taskBtn('item',name,'Build '+name)}<button class="btn sm ${(P.goals||[]).includes(name)?'on':''}" data-goal="${esc(name)}">${(P.goals||[]).includes(name)?'★ Tracking':'☆ Track'}</button></span></div>${it.p?sellerRow(name+' Set'):''}${progHTML()}</div><ol class="steps">`;
  h+=step('bp|'+name,'Get the blueprint',bpSource(it,opts.note));
  let pi=0;for(const p of it.parts){pi++;
    if(p.k==='p'&&p.n==='Blueprint')continue;
    if(p.k==='p'){const full=p.full||(name+' '+p.n);
      let src='';if(p.rel)src=`${priceChip(full)}${p.du?` <span class="chip">${p.du} ducats</span>`:''}${sellerRow(full)}`+relicChips(p.rel);
      else if(p.dr&&p.dr.length)src=dropsList(p.dr,2);else src='Same source as the blueprint.';
      h+=step('part|'+name+'|'+p.n,`Get ${esc(full)}${p.sub?' blueprint':''}`,src);
      if(p.sub)h+=step('built|'+name+'|'+p.n,`Craft ${esc(p.n)} · ${hrs(p.t)} · ${fmt(p.cr)} cr`,resRows(p.sub,'res|'+name+'|'+p.n)+`<button class="btn sm" style="margin-top:8px" data-fstart="${esc(name+' '+p.n)}">⏱ Start Foundry timer</button>`);
    }else if(p.k==='i'){
      h+=step('have|'+name+'|'+p.n+'|'+pi,`Have a spare ${L(p.n)}${p.q>1?' ×'+p.q:''} (used up by the recipe)`,
        depth<3?`<details class="more lazy" data-tree="${esc(p.n)}" data-depth="${depth+1}"><summary>${esc(p.n)} steps</summary><div class="sub"></div></details>`:'');
    }}
  const rs=it.parts.filter(p=>p.k==='r').map(p=>[p.n,p.q]);
  h+=step('build|'+name,`Build in Foundry · ${hrs(it.t)} · ${fmt(it.cr)} cr${it.rush?` <span class="muted">(rush ${it.rush}p)</span>`:''}`,(rs.length?resRows(rs,'res|'+name+'|main'):'')+`<button class="btn sm" style="margin-top:8px" data-fstart="${esc(name)}">Start Foundry timer</button>`);
  h+=step('m|'+name,`Rank to ${maxRank(it)} · ${mxChip(name)}`,`Level it fast on Hydron (Sedna) or Elite Sanctuary Onslaught.`);
  h+='</ol>';
  const T=totals(name,1,{cr:0,r:{},pt:0},[]);const tr=Object.entries(T.r).sort((a,b)=>b[1]-a[1]);
  if(tr.length)h+=`<details class="more" style="padding:4px 14px 12px"><summary>Total shopping list</summary><div class="small"><div style="margin:6px 0"><b>${fmt(T.cr)} credits</b> · fastest finish <b>${hrs((T.pt||0)+(it.t||0))}</b> (build parts together, then the final build)</div><ul class="reslist">${tr.map(([n,q])=>`<li><span></span><span class="q">${fmt(q)} × ${L(n)}${haveTag(n,q)}</span><span class="where">${farmFor(n)}</span></li>`).join('')}</ul></div></details>`;
  return h+'</section>'}

/* ---------- relics: inventory planner, ducats & trading ---------- */
const RCH={i:{C:25.33,U:11,R:2},e:{C:23.33,U:13,R:4},f:{C:20,U:17,R:6},r:{C:16.67,U:20,R:10}};
const RLAB={i:'Intact',e:'Exceptional',f:'Flawless',r:'Radiant'},RCOST={i:0,e:25,f:50,r:100};
function partDu(full){const it=partOwner(full);if(it){if(full===it.n+' Blueprint')return it.bpdu||(it.parts.find(p=>p.n==='Blueprint')||{}).du||null;const p=it.parts.find(x=>x.full===full);return p&&p.du||null}return null}
function relicEV(r,ref){const R=REL[r];let pl=0,du=0;R.rw.forEach(([n,rr])=>{const c=RCH[ref][rr]/100;const p=pv(n);if(p!=null)pl+=c*p;du+=c*(partDu(n)||0)});return {pl,du}}
function relicAdvice(r){const R=REL[r];const need=R.rw.filter(([n])=>!/Forma/.test(n)&&partNeeded(n));const rareNeed=need.some(([,rr])=>rr==='R');
  const ev={};['i','r'].forEach(k=>ev[k]=relicEV(r,k));const gain=ev.r.pl-ev.i.pl;
  if(rareNeed)return {t:'Refine to Radiant',why:'It holds a rare part you still need (2% → 10%).',k:'r',need};
  if(need.length)return {t:'Crack Intact',why:'The part you need is common or uncommon, so refining barely helps.',k:'i',need};
  if(gain>8)return {t:'Radiant for plat',why:`Radiant adds about ${Math.round(gain)}p of value per run.`,k:'r',need};
  return {t:'Crack Intact',why:'Nothing you need. Farm traces or sell the drops.',k:'i',need}}
function relicsPage(){const tab=state.rlTab||'mine';
  let h=`<div class="stack"><div class="head"><div class="eyebrow">Void relics</div><h1>Relics & trading</h1><p class="lede">Track the relics you own, see which to refine, and decide what to sell for platinum or ducats.</p></div>
  ${segBtns('rltab',tab,[['mine','My relics'],['add','Add relics'],['ducats','Ducats & trading']])}`;
  h+=tab==='add'?relicAdd():tab==='ducats'?ducatTab():relicMine();return h+'</div>'}

function summarize(raw){const j=raw.Results&&raw.Results[0]?raw.Results[0]:raw;const xpi=(j.LoadOutInventory&&j.LoadOutInventory.XPInfo)||findKey(j,'XPInfo',0)||[];const mis=j.Missions||[];const sk=j.PlayerSkills||{};
  const cat={};let gear=0,maxed=0;for(const e of xpi){const n=U[e.ItemType];if(!n)continue;const it=I[n];const k=perRank(it)===200?1000:500;const r=Math.min(maxRank(it),Math.floor(Math.sqrt((e.XP||0)/k)));const x=r*perRank(it);gear+=x;cat[it.c]=(cat[it.c]||0)+x;if(r>=maxRank(it))maxed++}
  let ch=0,sp=0,nodes=0,spn=0;for(const m of mis){const nd=NX[m.Tag];if(!nd)continue;if(m.Completes>0){ch+=nd.x;nodes++}if(m.Tier===1){sp+=nd.x;spn++}}
  let intr=0;for(const s in sk)if(/^LPS_/.test(s)&&typeof sk[s]==='number')intr+=sk[s]*1500;
  const syn=(j.Affiliations||[]).map(a=>({n:SYN[a.Tag]||pretty(a.Tag),t:a.Title||0})).sort((a,b)=>b.t-a.t).slice(0,3);
  return {name:j.DisplayName||j.displayName||'Tenno',mr:j.PlayerLevel??null,gear,maxed,ch,sp,nodes,spn,intr,total:gear+ch+sp+intr,cat,syn,at:new Date().toISOString()}}
function friendsTab(){const F=P.friends||[];const t=totalXP();const me={name:'You',mr:mrInfo(t.total).mr,total:t.total,gear:t.it,maxed:MI.filter(i=>itemXP(i.n)>=mxp(i)).length,nodes:ALLN.filter(n=>!isJ(n)&&on('n|'+n.id)).length,spn:ALLN.filter(n=>!isJ(n)&&on('sp|'+n.id)).length,intr:t.intr,cat:Object.fromEntries(CATS.map(c=>[c,catXP(c)]))};

   ${row('Mastery rank','mr',v=>v==null?'—':mrLabel(v))}${row('Total XP','total')}${row('Gear XP','gear')}${row('Items mastered','maxed')}${row('Nodes','nodes')}${row('Steel Path nodes','spn')}${row('Intrinsics XP','intr')}
   ${CATS.filter(c=>all.some(x=>x.cat&&x.cat[c])).map(c=>`<div class="fl small muted">${esc(c)}</div>${all.map(x=>`<div class="c mono small">${fmt(x.cat&&x.cat[c])}</div>`).join('')}`).join('')}</div>
   <div class="small muted" style="margin-top:8px">Friends' data is a snapshot from when you added them${F[0].at?' (oldest '+fdate(F.reduce((a,x)=>x.at<a?x.at:a,F[0].at))+')':''}. Add them again to refresh.</div></div>`:''}`}
async function addFriend(txt){txt=String(txt||'').trim();const msg=m=>{const el=$('#frmsg');if(el)el.textContent=m;toast(m)};if(!txt)return;
  let raw=null;try{raw=JSON.parse(txt)}catch(e){}
  if(!raw){const id=findId(txt);if(!id)return msg('Paste a profile page or a 24-character ID.');
    try{let j=null;if(window.TENNO_PROXY){const r=await fetch(window.TENNO_PROXY+'?playerId='+id);if(r.ok)j=await r.json()}
      if(!j){const r=await fetch('https://api.warframestat.us/profile/'+id+'/?language=en');if(r.ok){j=await r.json();j=fromParsed(j)}}
      if(!j)throw 0;raw=j}catch(e){return msg('Couldn\'t load that ID from here. Open https://api.warframe.com/cdn/getProfileViewingData.php?playerId='+id+' and paste the page instead.')}}
  const s=summarize(raw);if(!s.total)return msg('No ranks found in that data.');P.friends=(P.friends||[]).filter(f=>f.name!==s.name);P.friends.push(s);saveProfile();render();toast('Added '+s.name)}

  if(t.dataset.reld){const [r,k,d]=t.dataset.reld.split('|');P.rel=P.rel||{};const x=P.rel[r]=P.rel[r]||{};x[k]=Math.max(0,(+x[k]||0)+(+d));if(!relCount(r))delete P.rel[r];saveProfile();rerender();return}

/* ---------- owned items, quest detection ---------- */
function stepKeys(n){const it=I[n];if(!it)return[];const k=['bp|'+n];let pi=0;for(const p of it.parts){pi++;if(p.k==='p'&&p.n==='Blueprint')continue;
  if(p.k==='p'){k.push('part|'+n+'|'+p.n);if(p.sub){k.push('built|'+n+'|'+p.n);p.sub.forEach(([r])=>k.push('res|'+n+'|'+p.n+'|'+r))}}else if(p.k==='i')k.push('have|'+n+'|'+p.n+'|'+pi);else if(p.k==='r')k.push('res|'+n+'|main|'+p.n)}
  k.push('build|'+n);return k}
function setQ(k){const e=kenc(k);if(C[e])return;C[e]=1;if(docRef)pending[e]=1}
function exclusive(it){return it&&!it.p&&!it.bc&&!(it.bpd&&it.bpd.length)&&!(it.dr&&it.dr.length)&&!it.bprel}
function detectQuests(j,mis,owned){const det=new Set(['Awakening',"Vor's Prize"]);const nq=s=>s.toLowerCase().replace(/^the /,'').replace(/[^a-z0-9]/g,'');
  const ch=(j.ChallengeProgress||[]).map(c=>String(c.Name||'').toLowerCase());
  Q.forEach(q=>{const k=nq(q.n);if(k.length>=6&&ch.some(c=>c.includes(k)))det.add(q.n)});
  const PQ={Lua:'The Second Dream','Kuva Fortress':'The War Within',Deimos:'Heart of Deimos',Zariman:'Angels of the Zariman','Höllvania':'The Hex',Duviri:'The Duviri Paradox'};
  for(const m of mis){const nd=NX[m.Tag];if(nd&&m.Completes>0&&!/Junction|Hub|Relay/.test(nd.t)&&PQ[nd.p])det.add(PQ[nd.p])}
  for(const q of Q)for(const r of q.rw){const m=Object.keys(I).find(n=>r===n||r.toLowerCase().startsWith(n.toLowerCase()+' '));if(m&&owned.has(m)&&exclusive(I[m]))det.add(q.n)}
  if([...owned].some(n=>I[n].c==='Archwing'))det.add('The Archwing');
  if([...owned].some(n=>I[n].c==='Companion'&&/Kubrow/.test(n)))det.add('Howl of the Kubrow');
  const add=n=>{det.add(n);const q=Q.find(x=>x.n===n);if(q)qPrereqs(q).forEach(p=>{if(!det.has(p.n))add(p.n)})};[...det].forEach(add);
  return [...det].filter(n=>Q.some(q=>q.n===n))}

function synState(e){const s=(P.syn||{})[e.n]||{};return {r:s.r!=null?+s.r:(e.kind==='faction'?0:0),s:+s.s||0,sync:s.sync}}

function synCard(e){const st=synState(e),ok=gateOK(e.gate);const cur=rankRow(e,st.r),nx=rankRow(e,st.r+1);const top=e.ranks.length?e.ranks[e.ranks.length-1].r:0;
  const pct=cur.max!=null?Math.max(0,Math.min(100,(st.s-(cur.min||0))/((cur.max||1)-(cur.min||0))*100)):0;const dl=dailyLeft(e);

const PORD=['Mercury','Venus','Earth','Lua','Mars','Deimos','Phobos','Ceres','Jupiter','Europa','Saturn','Uranus','Neptune','Pluto','Sedna','Eris','Void','Kuva Fortress','Zariman','Duviri','Höllvania'];

  const all=ALLN.filter(n=>!isJ(n));const nd=all.filter(n=>on('n|'+n.id)).length,sd=all.filter(n=>on('sp|'+n.id)).length,jd=J.filter(n=>on('n|'+n.id)).length;

    <div class="tile cut"><span class="k">Steel Path</span><span class="v num">${sd}<small>/${all.length}</small></span><span class="tbar"><i style="width:${sd/all.length*100}%"></i></span></div>
    <div class="tile cut"><span class="k">Mission XP</span><span class="v num">${fmt(catXP('chart')+catXP('sp'))}</span><span class="x">of ${fmt(NODES.reduce((a,n)=>a+n.x,0)*2)}</span></div></div>
    <div class="planets">${planets.map(p=>{const s=planetStats(p);const pct=s.ns.length?s.d/s.ns.length*100:0;return `<button class="planet cut${s.d===s.ns.length?' full':''}" data-scp="${esc(p)}"><span class="pring" style="--p:${pct.toFixed(0)}">${orb(p,46)}</span><span class="pn">${esc(p)}</span><span class="small mono">${s.d}/${s.ns.length}${s.s?` · SP ${s.s}`:''}</span></button>`}).join('')}</div>
    <details class="obj grp" open data-scope="input.ck.jn"><summary><h3>Junctions</h3>${progHTML()}</summary><div class="small muted" style="padding:10px 14px 0">Beat the junction's Specter after finishing its tasks to open the next planet. 1,000 Mastery XP each, and again on Steel Path.</div>
    <div style="padding:0 14px 10px"><div class="nodes"><div class="h">Junction</div><div class="h c">Done</div><div class="h c">Steel</div>${J.map(n=>`<div><span>${orb(n.id.match(/^(\w+?)To/)?.[1]||'',18)}<b>${esc(jLabel(n))}</b> <span class="small muted">1,000 XP</span></span></div><div class="c">${ck('n|'+n.id,'sm jn')}</div><div class="c">${ck('sp|'+n.id,'sm')}</div>`).join('')}</div></div></details>${juncTasks()}</div>`;return h}
  const s=planetStats(sel);const tf=state.misType||'all',hide=state.misHide,q=(state.scQ||'').toLowerCase();

  const rr=(D.regres[sel]||D.regres[sel==='Zariman'?'Zariman Ten Zero':sel]||[]);const pj=ALLN.filter(n=>isJ(n)&&(n.id.startsWith(sel)));

  ${pj.length?`<div class="panel cut stack"><div class="eyebrow">Junctions from ${esc(sel)}</div>${pj.map(n=>`<div class="row" style="justify-content:space-between">${ck('n|'+n.id,'sm jn')}<b style="flex:1">${esc(jLabel(n))}</b><span class="small muted">1,000 XP</span></div>`).join('')}</div>`:''}`;
  return h+'</div>'}

  const css='body{font:14px/1.5 system-ui,sans-serif;background:#0b1016;color:#dce6ea;margin:0;padding:24px}h1{color:#d9b45e;margin:0 0 4px}h2{color:#6fd6e8;border-bottom:1px solid #2b4a58;padding-bottom:4px;margin-top:28px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #1e3440;padding:5px 8px;text-align:left}th{color:#8fa3ac;text-transform:uppercase;font-size:11px;letter-spacing:.08em}.k{display:inline-block;margin:4px 14px 4px 0}.k b{color:#d9b45e;font-size:20px}pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#121d27;padding:12px}';

async function saveFile(name,text,type){if(HOSTED){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Saved '+name);return}
  try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(!dl)throw 0;await dl.save({filename:name,data:text});toast('Saved '+name)}catch(e){toast('Saving files isn\'t available here.')}}

  for(const r of pri){const m=text.match(r);if(m)return m[1].toLowerCase()}const all=text.match(/\b[0-9a-f]{24}\b/gi);return all&&all.length===1?all[0].toLowerCase():null}

function ease(it){if(it.p)return it.v?(VAULT[it.n]&&VAULT[it.n].now?2:4):2;if(it.bc)return 0;if(it.bpd||it.dr)return 1;return 3}
const EASE=['Market blueprints','Boss and node drops','Farm relics','Quest, syndicate or vendor','Vaulted: buy on warframe.market'];

function rewardLink(r){const m=Object.keys(I).find(n=>r.toLowerCase().startsWith(n.toLowerCase()+' ')||r===n);if(m)return `<a class="ln" href="#" data-go="item|${esc(m)}">${esc(r)}</a> ${mxChip(m)}`;if(MODS[r]||RES[r]||ARC[r])return L(r);return esc(r)}

function setsTab(){const rows=Object.entries(D.sets).map(([n,s])=>{const base=n.replace(/ Set$/,'');const it=I[base];let ps=0,du=0,okp=true;

  if(t.id==='exhtml'){const nm=(P.tname||(P.prof&&P.prof.name)||'tenno').replace(/\W+/g,'-');saveFile('tennoform-report-'+nm+'.html',reportHTML(),'text/html');return}
  if(t.id==='exjson'){saveFile('tennoform-data.json',JSON.stringify({v:3,exported:new Date().toISOString(),c:C,p:P},null,1),'application/json');return}
  if(t.dataset.goal){const n=t.dataset.goal;P.goals=P.goals||[];const i=P.goals.indexOf(n);if(i>=0)P.goals.splice(i,1);else P.goals.push(n);saveProfile();toast(i>=0?'Removed from Goals':'Added to Goals');const y=scrollY;render();scrollTo(0,y);return}
  if(t.id==='syh'){state.syH=!state.syH;saveUI();render();return}
  if(t.id==='gshort'){state.gShort=!state.gShort;render();return}
  if(t.id==='lggoogle'){signGoogle();return}
  if(t.id==='lgin'){signEmail(false);return}
  if(t.id==='lgnew'){signEmail(true);return}
  if(t.id==='lgreset'){resetPw();return}
  if(t.id==='lgout'){flushNow();FB&&FB.auth.signOut();toast('Signed out. Progress stays in this browser too.');return}
  if(t.dataset.rk){const row=t.closest('.rk');const n=row.dataset.n;const r=rankOf(n);setRank(n,t.dataset.rk==='max'?99:r+(+t.dataset.rk));row.outerHTML=rkRow(I[n]);return}
  if(t.dataset.intr){const [key,n]=t.dataset.intr.split('|');const v=+((P[key]||{})[n]||0);setIntr(t.dataset.intr,t.dataset.d==='max'?10:v+(+t.dataset.d));const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(t.dataset.rkcat){e.preventDefault();state.rkCat=t.dataset.rkcat;state.rkQ='';saveUI();if(location.hash!=='#ranks')location.hash='ranks';else render();return}
  if(t.id==='rkmaxall'){if(!t.dataset.armed){t.dataset.armed=1;t.textContent='Tap again to confirm';t.classList.add('primary');setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.classList.remove('primary');t.textContent='Max all shown'}},4000);return}
    (state._rkList||[]).forEach(n=>{if(!on('m|'+n))setRank(n,99)});render();toast('Marked '+(state._rkList||[]).length+' items mastered');return}
  if(t.id==='boreset'){P.bo={};saveProfile();render();toast('Using your Ranks page numbers again');return}
  if(t.dataset.qupto){const q=Q.find(x=>x.n===t.dataset.qupto);const idx=Q.indexOf(q);const arc=/^Arc/.test(q.g);Q.forEach((o,i)=>{if(i<=idx&&(arc?/^Arc/.test(o.g):o.g===q.g))setK('q|'+o.n,1)});const y=window.scrollY;render();window.scrollTo(0,y);toast('Marked quests up to '+q.n+' complete');return}
  if(t.dataset.go){e.preventDefault();go(t.dataset.go)}
  else if(t.dataset.mtab){e.preventDefault();state.mTab=t.dataset.mtab;saveUI();if(location.hash!=='#mastery')location.hash='mastery';else render()}
  else if(t.dataset.ttab){e.preventDefault();state.tTab=t.dataset.ttab;saveUI();if(location.hash!=='#tenno')location.hash='tenno';else render()}
  else if(t.dataset.mk){state.mkTab=t.dataset.mk;saveUI();render()}
  else if(t.dataset.build){state.build=+t.dataset.build;render()}
  else if(t.dataset.frame){e.preventDefault();state.frame=t.dataset.frame;state.build=0;saveUI();if(location.hash!=='#frames')location.hash='frames';else{render();window.scrollTo(0,0)}}
  else if(t.dataset.pick){state.farmSel=t.dataset.pick;if(location.hash!=='#farm')location.hash='farm';else{$('#fdet').innerHTML=detail(state.farmSel);document.querySelectorAll('#fres .hit').forEach(h=>h.classList.toggle('sel',h.dataset.pick===state.farmSel));refresh();$('#fdet').scrollIntoView({block:'start',behavior:'smooth'})}}
  else if(t.dataset.cat){state.allCat=t.dataset.cat;state.allQ='';saveUI();render()}
  else if(t.dataset.planet){const md=t.dataset.mode;ALLN.filter(n=>n.p===t.dataset.planet&&!isJ(n)).forEach(n=>setK(md+'|'+n.id,1));state.scP=t.dataset.planet;const y=scrollY;render();scrollTo(0,y);toast('Marked '+t.dataset.planet+(md==='sp'?' Steel Path':'')+' complete')}
  else if(t.dataset.q){e.preventDefault();state.qFocus=t.dataset.q;if(location.hash!=='#quests')location.hash='quests';else focusQuest()}
  else if(t.dataset.wh){copy(t.dataset.wh,'Whisper copied. Paste it into in-game chat.')}
  else if(t.dataset.fstart){const n=t.dataset.fstart;const d=foundryFind(n)||43200;P.foundry=P.foundry||[];P.foundry.push({id:Date.now().toString(36),n,t0:Date.now(),dur:d});saveProfile();toast(n+' started · ready in '+hrs(d))}
  else if(t.id==='faddb'){const n=$('#fadd').value.trim();if(!n)return;const d=foundryFind(n);P.foundry=P.foundry||[];P.foundry.push({id:Date.now().toString(36),n,t0:Date.now(),dur:d||43200});saveProfile();render();toast(d?n+' added':'Added with a 12 h default timer')}
  else if(t.dataset.fclaim){const f=(P.foundry||[]).find(x=>x.id===t.dataset.fclaim);if(f){P.foundry=P.foundry.filter(x=>x!==f);if(I[f.n])setK('build|'+f.n,1);else{const m=Object.values(I).find(it=>it.parts.some(p=>p.sub&&it.n+' '+p.n===f.n));if(m)setK('built|'+m.n+'|'+f.n.slice(m.n.length+1),1)}saveProfile();render();toast(f.n+' claimed')}}
  else if(t.dataset.fdel){P.foundry=(P.foundry||[]).filter(x=>x.id!==t.dataset.fdel);saveProfile();render()}
  else if(t.id==='autosync'){t.disabled=true;t.textContent='Syncing…';await autoSync(false);if(t.isConnected){t.disabled=false;t.textContent='Sync automatically'}}
  else if(t.id==='openprof'){if(!/^[0-9a-f]{24}$/i.test(P.wfid||'')){e.preventDefault();toast('Enter your 24-character account ID first');$('#wfid')?.focus()}}
  else if(t.id==='budget'){state.budget=!state.budget;saveUI();render()}
  else if(t.id==='unv'){state.unvOnly=!state.unvOnly;t.classList.toggle('on');$('#fres').innerHTML=resultsHTML()}
  else if(t.id==='jump'){$('#fdet').scrollIntoView({block:'start',behavior:'smooth'})}
  else if(t.id==='allhide'){state.allHide=!state.allHide;saveUI();render()}
  else if(t.id==='mishide'){state.misHide=!state.misHide;saveUI();render()}
  else if(t.id==='imp'){const msg=importProfile($('#pj').value);render();toast(msg)}
  else if(t.id==='bk-copy'){copy(backupCode(),'Backup code copied')}
  else if(t.id==='bk-file'){if(HOSTED){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupCode()],{type:'text/plain'}));a.download='tennoform-backup.txt';document.body.appendChild(a);a.click();a.remove();toast('Backup saved');return}try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(!dl)throw 0;await dl.save({filename:'tennoform-backup.txt',data:backupCode()});toast('Backup saved')}catch(err){toast('Saving files isn\'t available here. Use Copy backup code instead.')}}
  else if(t.id==='bk-restore'){if(restore($('#bk-in').value)){render();toast('Progress restored')}else toast('That code didn\'t work. Paste the full backup code.')}});
function focusQuest(){if(!state.qFocus)return;const el=document.getElementById('q-'+state.qFocus.replace(/\W/g,''));state.qFocus=null;if(el){const d=el.closest('details');if(d)d.open=true;el.scrollIntoView({block:'center',behavior:'smooth'});el.style.background='var(--cyan-soft)';setTimeout(()=>el.style.background='',1600)}}
function liveSearch(id,key){const q=$(id);if(!q)return;q.addEventListener('input',()=>{state[key]=q.value;const pos=q.selectionStart;render();const n=$(id);n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}})}
function bindPage(r){
  if(r==='farm'){const q=$('#fq');q.addEventListener('input',()=>{state.farmQ=q.value;$('#fres').innerHTML=resultsHTML()})}
  if(r==='resources')liveSearch('#rq','resQ');
  if(r==='missions')liveSearch('#scq','scQ');
  if(r==='ranks')liveSearch('#rkq','rkQ');
  if(r==='market')liveSearch('#mq','mkQ');
  if(r==='arsenal'&&state.aTab==='arc')liveSearch('#arq','arQ');
  if(r==='relics'&&state.rlTab==='add')liveSearch('#raq','raQ');
  if(r==='relics'&&state.rlTab==='ducats')liveSearch('#duq','duQ');
  if(r==='quests')setTimeout(focusQuest,50);
  if(r==='missions'&&state.planet){const p=state.planet;state.planet=null;setTimeout(()=>{const el=document.getElementById('pl-'+p.replace(/\W/g,''));if(el){el.open=true;el.scrollIntoView({block:'start',behavior:'smooth'})}},50)}
  if(r==='mastery'&&state.mTab==='all')liveSearch('#allq','allQ');
  if(r==='tenno'&&state.tTab==='inventory')liveSearch('#invq','invQ');
  if(r==='resources'&&state.resSel&&window.innerWidth<900&&!state.resQ)setTimeout(()=>$('#rdet')?.scrollIntoView({block:'start'}),30)}
liveResurgence();
function bootSync(){if(HOSTED&&P.wfid&&(!P.auto||Date.now()-new Date(P.auto)>6*3600e3))autoSync(true)}
setInterval(()=>{if(location.hash==='#tenno'&&state.tTab==='foundry'&&!(document.activeElement&&document.activeElement.matches('input,textarea')))render()},60000);
render();fbInit();
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readLog(f)}});
})();
</script>
