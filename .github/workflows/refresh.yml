name: Refresh market prices
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh            # publish.sh moves onto anything pushed to main while this runs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # ~2,300 items (Prime sets, mods, arcanes) at about 2 s each
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100   # make_site.py keeps the files of recent versions, so it needs their history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build/refresh_market.py
      - run: |
          git config user.name "tennoform-bot"
          git config user.email "tennoform-bot@users.noreply.github.com"
          git add build/market.json build/pricehist.json
          git diff --cached --quiet && { echo "Prices unchanged"; exit 0; }
          git commit -q -m "Refresh market prices"
          build/publish.sh "Build site with new prices"
