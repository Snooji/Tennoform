name: Game data update
# Daily (and on demand): when WFCD's warframe-items has a new release, rebuild the game data and publish it.
# Safety checks run first; if any fails, nothing is published and the run fails (GitHub emails the owner).
on:
  schedule:
    - cron: '41 9 * * *'   # every day; the price refresh runs at 10:23
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-data          # never at the same time as the price refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100   # make_site.py keeps the files of recent versions, so it needs their history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare game data version with WFCD
        id: ver
        run: |
          CUR=$(python3 -c "import json;print(json.load(open('build/base.json'))['meta'].get('wfcd',''))")
          NEW=$(npm view @wfcd/items version)
          echo "Site uses $CUR, latest is $NEW"
          echo "cur=$CUR" >> "$GITHUB_OUTPUT"; echo "new=$NEW" >> "$GITHUB_OUTPUT"
      - name: Download WFCD data
        if: steps.ver.outputs.cur != steps.ver.outputs.new
        run: |
          mkdir -p "$RUNNER_TEMP/wfcd" && cd "$RUNNER_TEMP/wfcd"
          npm pack "@wfcd/items@${{ steps.ver.outputs.new }}" --silent
          tar -xzf wfcd-items-*.tgz
      - name: Rebuild game data
        if: steps.ver.outputs.cur != steps.ver.outputs.new
        run: |
          J="$RUNNER_TEMP/wfcd/package/data/json"
          cp build/base.json "$RUNNER_TEMP/base.before.json"
          python3 -I build/update_gamedata.py "$J" "${{ steps.ver.outputs.new }}" | tee "$RUNNER_TEMP/summary.txt"
          python3 -I build/make_stats.py "$J"
          python3 -I build/make_modinfo.py "$J"
          python3 -I build/make_umap.py "$J"
          python3 -I build/make_crafts.py "$J"
          python3 build/make_site.py
      - name: Safety checks
        if: steps.ver.outputs.cur != steps.ver.outputs.new
        run: |
          python3 - "$RUNNER_TEMP/base.before.json" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1])); b = json.load(open('build/base.json'))
          problems = []
          for k in ('items', 'relics', 'mods', 'arcanes', 'res', 'nodes', 'quests'):
              if len(b[k]) < len(a[k]):
                  problems.append(f'{k}: {len(a[k])} before, {len(b[k])} after')
          gone = [n for n in a['items'] if n not in b['items']]
          if gone: problems.append('items removed: ' + ', '.join(gone[:20]))
          for n, it in b['items'].items():
              if not it.get('c') or not isinstance(it.get('parts'), list):
                  problems.append(f'item {n} is missing its category or parts'); break
          s = json.load(open('data/stats.json'))
          if len(s) < 0.9 * len(b['items']): problems.append(f'stats cover only {len(s)} items')
          mi = json.load(open('data/mods.json'))
          if len(mi) < 0.9 * (len(b['mods']) + len(b['arcanes'])): problems.append(f'mod details cover only {len(mi)} mods and arcanes')
          import re, os
          html = open('index.html', encoding='utf-8').read()
          game = re.search(r'/bundle/(game-[\w]+\.js)', html)
          gf = os.path.join('bundle', game.group(1)) if game else ''
          if not game or not os.path.exists(gf) or os.path.getsize(gf) < 1_000_000 or 'Frost Prime' not in open(gf, encoding='utf-8').read():
              problems.append('the page build looks wrong (game data file missing or too small)')
          for k in ('market', 'code'):
              m = re.search(r'/bundle/(%s-[\w]+\.js)' % k, html)
              if not m or not os.path.exists(os.path.join('bundle', m.group(1))): problems.append(f'the page build is missing its {k} file')
          if problems:
              print('Not publishing:'); print('\n'.join(' - ' + p for p in problems)); sys.exit(1)
          print('All checks passed')
          PY
      - name: Publish
        if: steps.ver.outputs.cur != steps.ver.outputs.new
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          git config user.name "tennoform-bot"
          git config user.email "tennoform-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          { echo "Game data update: WFCD $NEW"; echo; cat "$RUNNER_TEMP/summary.txt"; } > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          git push
