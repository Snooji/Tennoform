name: Check for new game data
on:
  schedule:
    - cron: '41 9 * * 1'   # Mondays
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare game data version with WFCD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUR=$(python3 -c "import json;print(json.load(open('build/base.json'))['meta'].get('wfcd',''))")
          NEW=$(npm view @wfcd/items version)
          echo "Site uses $CUR, latest is $NEW"
          if [ "$CUR" != "$NEW" ]; then
            if ! gh issue list --state open --search "Game data update" --json title --jq '.[].title' | grep -q "Game data update"; then
              gh issue create --title "Game data update available ($NEW)" \
                --body "WFCD warframe-items has a new release ($NEW; the site uses $CUR). New Warframes, weapons or changes may be missing until the game data is rebuilt. Check the official patch notes: https://www.warframe.com/en/patch-notes/pc"
            fi
          fi
